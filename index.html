<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10x-shop-zazabaramidze</title>
    <script>
      // თემის აღდგენა გვერდის დახატვამდე, რომ გადატვირთვისას თეთრი ფლეში არ გაჩნდეს
      try {
        if (localStorage.getItem('shop_theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch {
        /* localStorage მიუწვდომელია: ვრჩებით light თემაზე */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
